<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>(가상) 행정정보 통합관리 기본법 조문 검색</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="law">
        <h1>(가상) 행정정보 통합관리 기본법</h1>
        <p>시행 2026. 7. 1., 법률 제99999호</p>
      </div>
      <div class="search" role="search">
        <label for="search" class="sr-only">조문 검색</label>
        <input id="search" type="search" placeholder="키워드로 조문 찾기 (예: 대통령령, 과태료)" autocomplete="off" spellcheck="false" autofocus>
        <button id="clear" type="button" aria-label="검색어 지우기" hidden>×</button>
      </div>
      <p id="count" class="count" aria-live="polite">불러오는 중…</p>
    </div>
  </header>

  <main>
    <div id="cards" class="cards"></div>
    <div id="empty" class="empty" hidden>
      <p><strong id="emptyQuery"></strong>이(가) 들어간 조항이 없습니다.</p>
      <button id="reset" type="button">검색어 지우고 전체 보기</button>
    </div>
  </main>

  <footer>
    <p>가상 자료입니다. 실제 법령과 무관합니다.</p>
    <p id="source"></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
